# 《雾城拾荒者》剧情知识图谱 — 前 12 章
# 用法: python scripts/novel/novel_graph.py examples/novel-graph/graph.yaml validate
#
# 本示例故意包含 1 处因果链断裂（第12章事件「老周赠真盒」无先导边），
# 用于演示 novel_graph.py 的熔断能力。修复方法见文件底部注释。

meta:
  book: "雾城拾荒者"
  last_updated: "2026-08-06"
  total_chapters: 12

nodes:
  # ── 角色 ──
  - { id: lin-ye,      type: character, name: "林野" }
  - { id: lao-zhou,    type: character, name: "老周" }
  - { id: station-master, type: character, name: "站长", note: "第11章死亡" }
  - { id: lin-ye-father, type: character, name: "林野之父", note: "已故" }

  # ── 地点 ──
  - { id: fog-city,    type: place, name: "雾城" }
  - { id: pipe-spot,   type: place, name: "管道口拾荒点" }
  - { id: clock-tower, type: place, name: "城南钟楼" }

  # ── 物品 ──
  - { id: pocket-watch,  type: item, name: "旧怀表" }
  - { id: half-bill,     type: item, name: "半张雾币" }
  - { id: eagle-box,     type: item, name: "鹰徽金属盒" }
  - { id: fake-eagle-box,type: item, name: "假鹰徽盒" }

  # ── 事件 ──
  - { id: ev-station-death, type: event, name: "站长之死", initial: true, note: "开篇谜团，豁免先导检查" }
  - { id: ev-lin-picks-bill, type: event, name: "林野捡起半张雾币" }
  - { id: ev-lin-sold-fake,  type: event, name: "林野卖出假鹰徽盒" }
  - { id: ev-lao-gives-box,  type: event, name: "老周赠予鹰徽盒" }

edges:
  # 人物关系
  - { from: lin-ye,        to: fog-city,      relation: "居住",        chapter: 1 }
  - { from: lin-ye,        to: pipe-spot,     relation: "拾荒点",       chapter: 1 }
  - { from: lin-ye,        to: pocket-watch,  relation: "持有",         chapter: 1 }
  - { from: lin-ye-father, to: pocket-watch,  relation: "遗赠",         chapter: 1 }
  - { from: lao-zhou,      to: fog-city,      relation: "经营回收站",   chapter: 2 }

  # 第 10 章先导：站长死时攥着半张雾币（物品先导 → 第11章捡币）
  - { from: station-master, to: half-bill,     relation: "死时攥着",    chapter: 10 }
  - { from: lin-ye,        to: fake-eagle-box, relation: "翻出",        chapter: 10 }
  - { from: lin-ye,        to: ev-lin-sold-fake, relation: "卖出",      chapter: 10 }
  - { from: ev-lin-sold-fake, to: fake-eagle-box, relation: "卖",       chapter: 10 }
  - { from: fake-eagle-box, to: eagle-box,     relation: "同款对照",    chapter: 10 }
  - { from: lao-zhou,      to: eagle-box,     relation: "持有真盒",     chapter: 10 }

  # 第 11 章：站长之死 → 林野捡币（同章递进 + 事件涉及半张雾币）
  - { from: ev-station-death, to: ev-lin-picks-bill, relation: "同章递进", chapter: 11 }
  - { from: ev-lin-picks-bill, to: half-bill,     relation: "获得",      chapter: 11 }

  # 第 12 章：真盒交付（涉及 eagle-box，其第 10 章先导已存在）
  - { from: lao-zhou,      to: ev-lao-gives-box, relation: "赠予",      chapter: 12 }
  - { from: ev-lao-gives-box, to: eagle-box,     relation: "交付",      chapter: 12 }
  - { from: eagle-box,     to: clock-tower,   relation: "约定地点",     chapter: 12 }

chapter_events:
  - { chapter: 10, event: ev-lin-sold-fake }
  - { chapter: 11, event: ev-station-death }
  - { chapter: 11, event: ev-lin-picks-bill }
  - { chapter: 12, event: ev-lao-gives-box }
