platform: codex
matrix_version: 2
description: "Codex Desktop 的 capability parity 矩阵"

capabilities:
  routing.stage-gate:
    status: supported
    binding: "harness-kit/core/routing.md 阶段门禁 + update_plan"
    notes: "写 specs/plans/decisions 后暂停等确认"
  routing.harness-declare:
    status: supported
    binding: "首句「Harness：...」声明"
    notes: null
  orchestration.dispatch:
    status: supported
    binding: "spawn_agent（v2：task_name+message+fork_turns；v1 前缀 multi_agent_v1 已过时） + agents/*.md（或 .codex/agents/*.toml）"
    notes: "Codex 原生 subagents 已 GA（v0.115.0+）；v2 下子代理模型受父模型限制"
  orchestration.leader:
    status: supported
    binding: "主会话 Leader"
    notes: null
  orchestration.parallel-wu:
    status: supported
    binding: "并行 spawn_agent; 官方默认 max_threads=6, max_depth=1（建议单层扇出 ≤6）"
    notes: null
  orchestration.dispatch-track:
    status: supported
    binding: "update_plan in_progress/completed + 子任务文件清单"
    notes: null
  orchestration.worktree-sandbox:
    status: partial
    binding: "桌面版内置 git worktrees（线程隔离）；CLI 手动 git worktree"
    notes: "fork_context=true 隔离工作区；Codex App 原生支持 worktrees"
  orchestration.provision-context:
    status: degraded
    binding: "fork_context=true 派发 / git worktree"
    notes: null
  orchestration.destroy-context:
    status: manual
    binding: "close_agent / git worktree 清理"
    notes: null
  orchestration.collective-closeout:
    status: supported
    binding: "collective-test + 尾盘 requesting-code-review + update_plan"
    notes: null
  orchestration.continuous-loop:
    status: manual
    binding: "多会话 HANDOFF 人工衔接"
    notes: null
  roles.coder:
    status: supported
    binding: "spawn_agent + agents/coder.md"
    notes: null
  roles.implementer:
    status: supported
    binding: "spawn_agent + agents/implementer.md"
    notes: null
  roles.reviewer:
    status: supported
    binding: "spawn_agent readonly + agents/reviewer.md"
    notes: null
  roles.test-engineer:
    status: supported
    binding: "spawn_agent + agents/test-engineer.md"
    notes: null
  roles.explorer:
    status: supported
    binding: "spawn_agent + agents/explorer.md"
    notes: null
  roles.debugger:
    status: supported
    binding: "spawn_agent + agents/debugger.md"
    notes: null
  roles.web-investigator:
    status: supported
    binding: "spawn_agent + agents/web-investigator.md"
    notes: null
  artifacts.runtime-layout:
    status: supported
    binding: ".ai-runtime-artifacts/"
    notes: null
  artifacts.verification-lite:
    status: supported
    binding: "verification-lite.md"
    notes: null
  skills.stage-load:
    status: supported
    binding: "原生 skill 发现：.agents/skills/<slug>/SKILL.md（项目/仓库根/用户级 ~/.agents/skills），显式调用 $skill-name，description 隐式触发"
    notes: "渐进式披露（先 name+description，选中才加载全文）；superpowers 经 symlink 原生加载"
  interaction.structured-ask:
    status: degraded
    binding: "对话式确认；request_user_input 仅 Plan 模式可用"
    notes: null
  hooks.session-lifecycle:
    status: supported
    binding: "~/.codex/hooks.json 或 .codex/hooks.json 或 config.toml [hooks]；事件 SessionStart/SubagentStart/PreToolUse/PostToolUse/UserPromptSubmit/SubagentStop/Stop"
    notes: "仅 command 型 handler 执行（prompt/agent 跳过）；Windows 兼容性未完全确认"

cross_cutting:
  parallel_agents:
    max: 6
    mechanism: "subagent"
    notes: "官方默认 max_threads=6；max_depth=1 不嵌套"
  worktree_sandbox:
    supported: true
    notes: "桌面版内置 git worktrees；CLI 手动"
  guardrail_support:
    input: true
    output: false
    notes: "hooks PreToolUse 可拦截（尚不支持 ask 决策）；PostToolUse/UserPromptSubmit 可审计"
