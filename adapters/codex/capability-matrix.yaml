platform: codex
matrix_version: 2
description: "Codex Desktop 的 capability parity 矩阵"

capabilities:
  routing.stage-gate:
    status: supported
    binding: "harness-kit/core/routing.md 阶段门禁 + update_plan"
    notes: "写 specs/plans/decisions 后暂停等确认"
  routing.harness-declare:
    status: supported
    binding: "首句「Harness：...」声明"
    notes: null
  orchestration.dispatch:
    status: supported
    binding: "multi_agent_v1.spawn_agent + harness-foundry/agents/*.md"
    notes: "Codex Desktop 原生子代理"
  orchestration.leader:
    status: supported
    binding: "主会话 Leader"
    notes: null
  orchestration.parallel-wu:
    status: supported
    binding: "并行 spawn_agent; 建议 ≤4"
    notes: null
  orchestration.dispatch-track:
    status: supported
    binding: "update_plan in_progress/completed + 子任务文件清单"
    notes: null
  orchestration.worktree-sandbox:
    status: degraded
    binding: "spawn_agent fork_context=true 隔离工作区"
    notes: "无原生 git worktree Provider，可 shell 调 git worktree"
  orchestration.provision-context:
    status: degraded
    binding: "fork_context=true 派发"
    notes: null
  orchestration.destroy-context:
    status: manual
    binding: "close_agent / git worktree 清理"
    notes: null
  orchestration.collective-closeout:
    status: supported
    binding: "collective-test + 尾盘 requesting-code-review + update_plan"
    notes: null
  orchestration.continuous-loop:
    status: manual
    binding: "多会话 HANDOFF 人工衔接"
    notes: null
  roles.coder:
    status: supported
    binding: "spawn_agent + agents/coder.md"
    notes: null
  roles.implementer:
    status: supported
    binding: "spawn_agent + agents/implementer.md"
    notes: null
  roles.reviewer:
    status: supported
    binding: "spawn_agent readonly + agents/reviewer.md"
    notes: null
  roles.test-engineer:
    status: supported
    binding: "spawn_agent + agents/test-engineer.md"
    notes: null
  roles.explorer:
    status: supported
    binding: "spawn_agent + agents/explorer.md"
    notes: null
  roles.debugger:
    status: supported
    binding: "spawn_agent + agents/debugger.md"
    notes: null
  roles.web-investigator:
    status: supported
    binding: "spawn_agent + agents/web-investigator.md"
    notes: null
  artifacts.runtime-layout:
    status: supported
    binding: ".ai-runtime-artifacts/"
    notes: null
  artifacts.verification-lite:
    status: supported
    binding: "verification-lite.md"
    notes: null
  skills.stage-load:
    status: supported
    binding: "Read SKILL.md 或 skill 工具加载"
    notes: null
  interaction.structured-ask:
    status: degraded
    binding: "对话式确认；request_user_input 仅 Plan 模式可用"
    notes: null
  hooks.session-lifecycle:
    status: unsupported
    binding: "手动执行"
    notes: "Codex 无 hook 生命周期机制"

cross_cutting:
  parallel_agents:
    max: 4
    mechanism: "subagent"
  worktree_sandbox:
    supported: false
  guardrail_support:
    input: false
    output: false
    notes: "依赖 harness 规则 + 验证证据，无 hook 层拦截"
