platform: codex
bindings_version: 2

primitives:
  DetectPlatform:
    binding: "Codex Desktop 会话（存在 AGENTS.md / shell_type=shell_command）"
    example: ""
  LoadCapability:
    binding: "Read harness-foundry/<path> 或通过 skill 工具加载 SKILL.md"
    example: ""
  StageGate:
    binding: "写 specs/plans/decisions 后回复中暂停等确认；update_plan 标 pending"
    example: ""
  ProvisionContext:
    binding: "spawn_agent(fork_context=true) 或 git worktree"
    provider_mapping:
      worktree: "git worktree add <path> <branch>"
      local: "默认 cwd"
      docker: "不支持"
  SpawnWorker:
    binding: "spawn_agent（v2：task_name+message+fork_turns）+ .codex/agents/<role>.toml（官方）或 agents/<role>.md（prompt 型，未获官方确认）；prompt 含 WU id/范围/done criteria"
    max_parallel: 6
    notes: "官方默认 max_threads=6、max_depth=1（单层扇出，不嵌套）"
    example: ""
  ParallelBatch:
    binding: "并行 spawn_agent 后 wait_agent；主 agent 整合"
    mechanism: "subagent"
    max_batch: 6
  DestroyContext:
    binding: "close_agent；git worktree remove"
    example: ""
  Integrate:
    binding: "主 agent 复核子任务 diff + 编译验证后合并"
    example: ""
  CollectiveTest:
    binding: "mvn compile/test + superpowers:verification-before-completion"
    example: ""
  CollectiveReview:
    binding: "requesting-code-review + 尾盘审查"
    example: ""
  StructuredAsk:
    binding: "对话式提问；request_user_input 仅 Plan 模式可用"
    degraded: true
    fallback: "直接文本提问"
  EmitHook:
    binding: "~/.codex/hooks.json / .codex/hooks.json / config.toml [hooks]（command 型；prompt/agent handler 跳过）"
    hook_config_path: "~/.codex/hooks.json"

platform_limits:
  worktree: partial
  notes: "桌面版内置 git worktrees（线程隔离）；CLI 手动 git worktree"
  hooks: supported
  notes2: "仅 command 型 handler；PreToolUse 尚不支持 ask 决策；Windows 兼容性未完全确认"
  parallel_limit: 6
  continuous_loop: manual
