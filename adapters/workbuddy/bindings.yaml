platform: workbuddy
bindings_version: 2
description: "WorkBuddy（腾讯，= CodeBuddy 双品牌）平台绑定 — 2026-08 基于官方文档"

# 配置面统一为 .codebuddy/（项目）+ ~/.codebuddy/（用户），双品牌共用。
# 官方兼容 Claude Code 生态：SKILL.md 开放标准、.claude-plugin/ 直接识别（不改名即可运行）、
# AGENTS.md 向后兼容（项目根有 AGENTS.md 而无 CODEBUDDY.md 时自动全文加载）。

primitives:
  DetectPlatform:
    binding: "存在 .codebuddy/ 或 CODEBUDDY.md（或 AGENTS.md）→ workbuddy；WorkBuddy 桌面端 / CodeBuddy CLI / VS Code 插件共用配置"
    example: ""
  LoadCapability:
    binding: "CODEBUDDY.md / AGENTS.md 自动加载；Read harness-foundry/<path> 或 Skill 工具加载 SKILL.md"
    example: ""
  StageGate:
    binding: "Plan 模式（先确认后执行）+ .codebuddy/rules/*.md（alwaysApply）"
    example: ""
  ProvisionContext:
    binding: "agent frontmatter isolation: \"worktree\"（原生 worktree 隔离）或 local"
    provider_mapping:
      worktree: "isolation: worktree"
      local: "默认 cwd"
      docker: "不支持"
  SpawnWorker:
    binding: ".codebuddy/agents/<role>.md（agentic 模式，主代理按 description 自动委派，独立上下文）；Team Mode 用 task/team_create/send_message"
    max_parallel: 5
    notes: "frontmatter 与 Claude Code 同构：name/description/model/effort/maxTurns/tools/disallowedTools/skills/memory/background/isolation"
    example: ""
  ParallelBatch:
    binding: "Team Mode 并行 Worker（task 工具）；主 agent 整合"
    mechanism: "subagent"
    max_batch: 5
  DestroyContext:
    binding: "Worktree 清理；close agent"
    example: ""
  Integrate:
    binding: "主 agent 复核子任务产物后合并"
    example: ""
  CollectiveTest:
    binding: "mvn compile/test + verification-before-completion"
    example: ""
  CollectiveReview:
    binding: "reviewer subagent + requesting-code-review"
    example: ""
  StructuredAsk:
    binding: "Ask/Plan 模式原生确认"
    example: ""
  EmitHook:
    binding: "hooks/hooks.json（SessionStart/SessionEnd/PreToolUse/PostToolUse/UserPromptSubmit/Stop/PreCompact；四型 command/http/prompt/agent）"
    hook_config_path: ".codebuddy/hooks/hooks.json 或 ~/.codebuddy/hooks/hooks.json 或插件内"

platform_limits:
  worktree: supported
  notes: "isolation: worktree 原生支持"
  hooks: supported
  notes2: "skill/agent frontmatter 声明的 hooks 默认拒绝（安全门禁）"
  parallel_limit: 5
  continuous_loop: supported
  notes3: "CLI /resume + .workbuddy/MEMORY.md 跨会话记忆"
