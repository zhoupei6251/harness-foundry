platform: workbuddy
matrix_version: 2
description: "WorkBuddy（腾讯，= CodeBuddy 双品牌）的 capability parity 矩阵 — 2026-08 基于官方文档（codebuddy.ai/docs）"

# 配置面：.codebuddy/（项目）+ ~/.codebuddy/（用户）；双品牌共用。
# 官方兼容 Claude Code 生态：SKILL.md 开放标准、.claude-plugin/ 直接识别、AGENTS.md 自动加载。

capabilities:
  routing.stage-gate:
    status: supported
    binding: ".codebuddy/rules/*.md + Plan 模式（Ask/Plan/Craft 三模式）"
    notes: "rules frontmatter: alwaysApply/paths/enabled；Plan 模式先确认后执行"
  routing.harness-declare:
    status: supported
    binding: "CODEBUDDY.md / AGENTS.md 自动加载（项目根有 AGENTS.md 而无 CODEBUDDY.md 时全文加载）"
    notes: null
  orchestration.dispatch:
    status: supported
    binding: "Subagent agentic 模式（主代理自动调度）+ Team Mode（主控 Orchestrator + Worker：task/team_create/send_message）"
    notes: ".codebuddy/agents/*.md；frontmatter 与 Claude Code 同构（model/tools/disallowedTools/isolation）"
  orchestration.leader:
    status: supported
    binding: "主 Agent 调度（内置 Agent 按 description 自动委派）"
    notes: null
  orchestration.parallel-wu:
    status: supported
    binding: "Team Mode 并行 Worker（task 工具）；社区逆向 team-orchestration 可达 28 专家团"
    notes: "官方未公布硬上限，未确认"
  orchestration.dispatch-track:
    status: supported
    binding: "DISPATCH-TRACK append-only + Team Mode 消息"
    notes: null
  orchestration.worktree-sandbox:
    status: supported
    binding: "agent frontmatter isolation: \"worktree\"（原生 worktree 隔离）"
    notes: "与 Claude Code 同构字段"
  orchestration.provision-context:
    status: supported
    binding: "isolation: worktree / local"
    notes: null
  orchestration.destroy-context:
    status: supported
    binding: "Worktree 清理（CLI / desktop 管理）"
    notes: null
  orchestration.collective-closeout:
    status: supported
    binding: "collective-test + reviewer subagent + code-review"
    notes: null
  orchestration.continuous-loop:
    status: supported
    binding: "CLI /resume + 跨会话记忆（.workbuddy/MEMORY.md）"
    notes: null
  roles.coder:
    status: supported
    binding: ".codebuddy/agents/coder.md（agentic 模式）"
    notes: null
  roles.implementer:
    status: supported
    binding: ".codebuddy/agents/implementer.md"
    notes: null
  roles.reviewer:
    status: supported
    binding: ".codebuddy/agents/reviewer.md（disallowedTools 限制写工具）"
    notes: null
  roles.test-engineer:
    status: supported
    binding: ".codebuddy/agents/test-engineer.md"
    notes: null
  roles.explorer:
    status: supported
    binding: ".codebuddy/agents/explorer.md（只读）"
    notes: null
  roles.debugger:
    status: supported
    binding: ".codebuddy/agents/debugger.md"
    notes: null
  roles.web-investigator:
    status: supported
    binding: ".codebuddy/agents/web-investigator.md"
    notes: null
  artifacts.runtime-layout:
    status: supported
    binding: ".ai-runtime-artifacts/"
    notes: null
  artifacts.verification-lite:
    status: supported
    binding: "verification-lite.md"
    notes: null
  skills.stage-load:
    status: supported
    binding: "原生 skill 发现：.agents/skills/<slug>/SKILL.md（项目，与 Claude 兼容）→ skills/（工作区）→ ~/.workbuddy/skills/ → ~/.codebuddy/skills/"
    notes: "SKILL.md 开放标准（Anthropic Agent Skills）；SkillHub 商城 + GitHub/Gitee 导入；兼容 OpenClaw 生态"
  interaction.structured-ask:
    status: supported
    binding: "Ask/Plan 模式原生确认"
    notes: null
  hooks.session-lifecycle:
    status: supported
    binding: "hooks/hooks.json 或插件内；事件 SessionStart/SessionEnd/PreToolUse/PostToolUse/UserPromptSubmit/Stop/PreCompact；四型 command/http/prompt/agent"
    notes: "skill/agent frontmatter 里声明的 hooks 默认拒绝（安全门禁）"

cross_cutting:
  parallel_agents:
    max: 5
    mechanism: "subagent"
    notes: "Team Mode 未公布硬上限；沿用 harness 默认 ≤5"
  worktree_sandbox:
    supported: true
    notes: "isolation: worktree"
  guardrail_support:
    input: true
    output: true
    notes: "hooks PreToolUse/PostToolUse + skill hooks 安全门禁；Guardian 危险模式 42 种（社区 harness 参考）"
