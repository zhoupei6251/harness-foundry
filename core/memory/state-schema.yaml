# 统一记忆状态结构 — Harness Foundry
#
# 三域共用模板。域特定字段通过 domain-config/<domain>.yaml 注入。
# 本文件定义所有域必填的通用字段，以及各域注入字段的完整声明。

---
schema_version: "1.0"

# ============================================================
# 所有域必填
# ============================================================
meta:
  domain:       {type: enum, values: [code, novel, news], required: true}
  project:      {type: string, required: true}
  phase:        {type: enum, values: [init, plan, design, implement, verify, idle, blocked]}
  last_updated: {type: datetime, format: ISO8601, required: true}
  active_wu:    {type: array, default: []}

# ============================================================
# 域特定字段 — 由 domain-config/<domain>.yaml 注入
# ============================================================
memory:
  # --- novel 域 ---
  novel:
    characters:      {type: table, columns: [name, status, location, goal, last_change]}
    foreshadowing:   {type: table, columns: [name, planted_ch, status, resolved_ch]}
    chapters:        {type: table, columns: [id, title, word_count, status, summary]}
    world_settings:  {type: text}

  # --- code 域 ---
  code:
    modules:          {type: table, columns: [path, status, last_modified, summary]}
    tech_debt:        {type: list}
    architecture:     {type: text, desc: "ADR 记录"}
    test_status:      {type: text}
    traps_discovered: {type: list}

  # --- news 域 ---
  news:
    sources:     {type: table, columns: [name, reliability, last_used, notes]}
    articles:    {type: table, columns: [id, title, word_count, status, summary]}
    fact_check:  {type: table, columns: [claim, source, verified, notes]}
    threads:     {type: table, columns: [name, status, started_at, last_update]}

# ============================================================
# 索引 — 所有域必填
# ============================================================
index:
  items:
    - id:       {type: string, required: true}
      type:     {type: string, required: true}
      status:   {type: enum, values: [draft, in_progress, done, blocked, archived]}
      summary:  {type: string, max_len: 140}
      path:     {type: string}

# ============================================================
# 阻塞项 — 所有域必填
# ============================================================
blockers:
  - id:          {type: string}
    desc:        {type: string}
    severity:    {type: enum, values: [blocker, major, minor]}
    created_at:  {type: datetime}
    resolved_at: {type: datetime, optional: true}

# ============================================================
# Agent 交接包 — 可选
# ============================================================
handoff:
  from:       {type: string}
  to:         {type: string}
  context:    {type: string, max_tokens: 100}
  timestamp:  {type: datetime}
  artifacts:  {type: array}

# ============================================================
# 连续学习 — Stop Hook 自动提取
# ============================================================
learning:
  last_session_id:     {type: string, optional: true}
  patterns_extracted:  {type: integer, default: 0}
  traps_recorded:      {type: integer, default: 0}
