# News 域记忆配置
# 注入到 state-schema.yaml 的 memory.news 字段

news:
  auto_update: true
  continuous_learning: true

  artifacts:
    runtime_dir: .harness-news-runtime
    memory_file: MEMORY.md
    state_file: .harness-news-runtime/memory/state.json

  triggers:
    on_session_start:
      action: read
      desc: "读取 MEMORY.md，3句话概括当前状态和待发稿件"
    on_article_start:
      action: append
      target: meta.active_wu
    on_article_done:
      action: update
      targets:
        - meta.active_wu
        - index.items
        - memory.news.articles
        - memory.news.sources
        - memory.news.fact_check
    on_session_end:
      action: compress_and_write
      targets:
        - meta.phase
        - meta.last_updated
        - blockers
        - memory.news.threads
        - learning.last_session_id
        - learning.patterns_extracted


  learn_types:
    - fact_check
    - writing_patterns
    - error_patterns

  handoff:
    enabled: true
    max_context_tokens: 80
    roles: [news-writer, fact-checker, news-editor]
    flow: "news-writer → fact-checker → news-editor"

  compression:
    enabled: true
    trigger_every_n_articles: 20
    keep_recent: 5
    summary_max_len: 200
