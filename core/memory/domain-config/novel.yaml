# Novel 域记忆配置
# 注入到 state-schema.yaml 的 memory.novel 字段

novel:
  auto_update: true
  continuous_learning: true

  artifacts:
    runtime_dir: .harness-novel-runtime
    memory_file: MEMORY.md
    state_file: .harness-novel-runtime/memory/state.json

  triggers:
    on_session_start:
      action: read
      desc: "读取 MEMORY.md + GLOBAL-MEMORY.md，3句话概括进度"
    on_chapter_start:
      action: append
      target: meta.active_wu
    on_chapter_done:
      action: update
      targets:
        - meta.active_wu
        - index.items
        - memory.novel.characters
        - memory.novel.foreshadowing
        - memory.novel.chapters
    on_session_end:
      action: compress_and_write
      targets:
        - meta.phase
        - meta.last_updated
        - memory.novel.characters
        - memory.novel.foreshadowing
        - learning.last_session_id
        - learning.patterns_extracted

  stop_hook:
    command: "node core/memory/continuous-learning/extractor.js --domain novel"
    timeout_ms: 5000
    non_blocking: true
    exit_zero: true

  learn_types:
    - writing_patterns
    - ai_markers
    - character_development
    - plot_structure

  handoff:
    enabled: true
    max_context_tokens: 150
    roles: [novel-writer, novel-planner, novel-reviewer, humanizer, editor, memory-keeper]
    flow: "writer → self-review → reviewer → humanizer → editor → memory-keeper"

  compression:
    enabled: true
    trigger_every_n_chapters: 5
    keep_recent: 3
    summary_max_len: 200

  mem0:
    enabled: false
    trigger_chapters: 50
    capabilities:
      - entity_linking
      - multi_signal_retrieval
      - temporal_awareness
      - memory_decay
