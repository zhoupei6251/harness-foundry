# Code 域记忆配置
# 注入到 state-schema.yaml 的 memory.code 字段

code:
  auto_update: true
  continuous_learning: true

  artifacts:
    runtime_dir: .ai-runtime-artifacts
    memory_file: MEMORY.md
    state_file: .ai-runtime-artifacts/memory/state.json
    traps_file: .ai-runtime-artifacts/memory/traps.json

  triggers:
    on_session_start:
      action: read
      desc: "读取 MEMORY.md + state.json，3句话概括进度"
    on_wu_start:
      action: append
      target: meta.active_wu
      desc: "WU 开始时追加到 active_wu 列表"
    on_wu_done:
      action: update
      targets:
        - meta.active_wu
        - index.items
        - memory.code.modules
        - memory.code.tech_debt
        - learning.traps_recorded
      desc: "WU 完成后更新索引和模块状态"
    on_session_end:
      action: compress_and_write
      targets:
        - meta.phase
        - meta.last_updated
        - blockers
        - learning.last_session_id
        - learning.patterns_extracted
      desc: "会话结束压缩并写回全部状态"


  learn_types:
    - debugging
    - project-patterns
    - error-handling
    - tool-tips

  handoff:
    enabled: true
    max_context_tokens: 100
    roles: [coder, implementer, reviewer, test-engineer, debugger, explorer]
    flow: "coder → reviewer → (返修 ≤2次)"

  compression:
    enabled: true
    trigger_every_n_wu: 10
    keep_recent: 5
    summary_max_len: 200
