# 领域编排配置
# 架构：用户 → Domain Leader → Worker
#
# - 用户：唯一的决策者。Leader 在阶段门禁处暂停等用户确认
# - Domain Leader：当前会话 AI。路由判定 → 拆 WU → 派兵 → 整合 → 汇报
# - Worker：子 Agent。执行具体任务（写代码/写章节/写稿件）
#
# 无需 handoff 文件传递，Leader 直接对用户负责。

# === 全局 Leader ===
# Leader 由当前会话 AI 担任，不通过 handoff 派发
leader:
  role: session-coordinator
  agents:
    - ceo
  skills:
    - ceo-orchestration

# === 域层 ===
domains:
  code:
    # 执行环境（P0-1: Harness/Compute 分离）
    execution:
      default_provider: worktree
      fallback_provider: local
      isolation_level: full
      auto_cleanup: true

    # CEO → Domain Leader 派发
    leader: leader-code
    workers:
      - coder
      - debugger
      - code-reviewer
      - reviewer
      - test-engineer

    # spawn 子代理（直接派，不调 Skill 工具）
    primary_agents:
      - java-reviewer            # ecc: Java/Spring Boot 审查
      - security-reviewer        # ecc: OWASP/安全漏洞检测
      - database-reviewer        # ecc: SQL/JPA 查询与 schema 审查

    secondary_agents:
      - code-simplifier          # 精简/优化代码
      - silent-failure-hunter    # 静默失败/吞异常检测

  novel:
    # 执行环境（P0-1: Harness/Compute 分离）
    execution:
      default_provider: local
      fallback_provider: local
      isolation_level: none
      auto_cleanup: false

    # CEO → Domain Leader 派发
    leader: leader-novel
    workers:
      - novel-writer
      - novel-planner
      - novel-reviewer
      - guardian
      - humanizer

    primary_agents:
      - leader-novel
      - novel-writer
      - novel-planner
      - novel-reviewer
      - guardian
      - humanizer

    secondary_agents:
      - shared-researcher        # 查资料时
      - editor                   # 统稿时
      - memory-keeper            # 记忆同步时

    # 命令入口
    commands:
      - /novel                  # 小说创作命令入口
      - /write                  # 写章节
      - /outline                # 写大纲
      - /evaluate               # 审稿评分
      - /polish                 # 润色

    # 编排与路由
    primary_skills:
      # 核心路由
      - novel-guidelines           # 写作前思维基线（MUST FIRST）
      - novel-debug               # 情节排查
      - novel-simplify            # 章节自查简洁度
      - novel-safe-revision       # 安全返修
      - novel-orchestrator       # 完整编排（复杂任务）
      - novel-quick-write        # 快速写作（单章）
      - novel-batch-write        # 批量写作
      - novel-36-beats           # 结构化节拍框架（三幕式大纲）
      - novel-writer-cn          # 人物设定与剧情框架
      - novel-generator          # 爽文自动生成

      # 质量保障
      - novel-evaluator          # 7维审稿评分
      - novel-receiving-review    # 接收审稿反馈
      - novel-self-review        # 写后自检（5维）
      - novel-mechanical-scorer  # 机械评分器（无LLM）
      - novel-guardian            # 法医式事实核查
      - novel-foreshadowing-dag   # 伏笔DAG管理
      - novel-voice-profile      # 人物声音档案
      - novel-contexts            # 上下文一致性
      - humanizer-zh             # 轻量润色

      # 进度与状态
      - novel-dashboard          # 进度仪表板
      - novel-checkpoint         # 检查点管理
      - novel-metrics            # 写作统计

      # 初始化
      - novel-init               # 新书创建向导
      - novel-recovery           # 会话恢复
      - novel-templates          # 创作模板库

    secondary_skills:
      - novel-ai-wash           # 深度文风清洗
      - novel-export             # 多格式导出
      - novel-mcp-server         # MCP服务接口
      - web-tools-guide          # 查资料
      - summarize               # 总结内容
      - memory-manager          # 记忆同步
      - inkos                   # InkOS 创作系统
      - fanqie-novel-auto-publish # 番茄发布

  news:
    # 执行环境（P0-1: Harness/Compute 分离）
    execution:
      default_provider: local
      fallback_provider: local
      isolation_level: none
      auto_cleanup: false

    # CEO → Domain Leader 派发
    leader: leader-news
    workers:
      - news-writer
      - fact-checker
      - news-editor

    primary_agents:
      - leader-news
      - news-writer
      - fact-checker

    secondary_agents:
      - news-editor            # 审校时
      - shared-researcher      # 调研时

    primary_skills:
      - news-generator
      - fact-check
      - news-polish

    secondary_skills:
      - hot-topic-research     # 追热点
      - web-tools-guide        # 查资料
      - summarize              # 生成简报
      - humanizer-zh           # 稿件去 AI 味

  # product 场景已合并到 code 域。本段保留为内部配置复用。
  # 路由：brainstorming → frontend-design / backend-doc-generator
  product:
    execution:
      default_provider: local
      fallback_provider: local
      isolation_level: none
      auto_cleanup: false

    # CEO → Domain Leader 派发
    leader: leader-product
    workers:
      - product-writer
      - product-reviewer

    primary_agents:
      - leader-product
      - product-writer
      - product-reviewer

    secondary_agents:
      - tech-writer            # 写技术文档/交付说明（已有 agent）

    # 场景预设（按客户类型路由）
    scenarios:
      college-frontend:
        description: "只想要前端页面的大学生"
        triggers:
          - 前端
          - 页面
          - HTML
          - Vue
          - React
          - 只想前端
        skills:
          - frontend-design
          - web-design-guidelines
        deliverables:
          - 页面代码
          - 部署说明
          - 使用文档

      college-backend:
        description: "只想要后端接口的大学生"
        triggers:
          - 后端
          - 接口
          - API
          - Spring
          - 只想后端
        skills:
          - backend-doc-generator
        deliverables:
          - 后端代码
          - API 文档
          - 部署说明

      college-fullstack:
        description: "前后端都要的大学生"
        triggers:
          - 全栈
          - 前后端
          - 完整
          - 都要
        skills:
          - frontend-design
          - backend-doc-generator
        deliverables:
          - 前端代码
          - 后端代码
          - 接口文档
          - 部署说明
          - 使用文档

    primary_skills:
      - brainstorming           # 场景选择 + 需求理解
      - frontend-design         # 前端交付
      - backend-doc-generator   # 后端交付
      - tech-writer             # 技术文档（用 agent）

    secondary_skills:
      - superdesign             # 前端设计指南（已有 skill）
      - humanizer-zh           # 中文去 AI 味
      - humanizer              # 英文去 AI 味

# === 运行时目录 ===
# handoff 机制已移除。Leader 直接对用户负责。
# 各域运行时产物路径见各域 artifacts 配置。
runtime:
  state_file: state.json
