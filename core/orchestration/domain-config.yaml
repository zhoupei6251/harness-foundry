# 领域编排配置
# 架构：用户 → Domain Leader → Worker
#
# - 用户：唯一的决策者。Leader 在阶段门禁处暂停等用户确认
# - Domain Leader：当前会话 AI。路由判定 → 拆 WU → 派兵 → 整合 → 汇报
# - Worker：子 Agent。执行具体任务（写代码/写章节/写稿件）
#
# 无需 handoff 文件传递，Leader 直接对用户负责。

# === 全局 Leader ===
# Leader 由当前会话 AI 担任，不通过 handoff 派发
leader:
  role: session-coordinator
  agents:
    - ceo
  skills:
    - ceo-orchestration

# === 域层 ===
domains:
  code:
    # 执行环境（P0-1: Harness/Compute 分离）
    execution:
      default_provider: worktree
      fallback_provider: local
      isolation_level: full
      auto_cleanup: true

    # CEO → Domain Leader 派发
    leader: leader-code
    workers:
      - coder
      - debugger
      - code-reviewer
      - reviewer
      - test-engineer

    # spawn 子代理（直接派，不调 Skill 工具）
    primary_agents:
      - ecc-java-reviewer        # ecc: Java/Spring Boot 审查（本地 agent 文件）
      - ecc-security-reviewer    # ecc: OWASP/安全漏洞检测（本地 agent 文件）
      - ecc-database-reviewer    # ecc: SQL/JPA 查询与 schema 审查（本地 agent 文件）

    secondary_agents:
      - code-simplifier          # 精简/优化代码
      - silent-failure-hunter    # ecc 插件 agent（ecc:silent-failure-hunter，运行时加载）

  novel:
    # 执行环境（P0-1: Harness/Compute 分离）
    execution:
      default_provider: local
      fallback_provider: local
      isolation_level: none
      auto_cleanup: false

    # CEO → Domain Leader 派发
    leader: leader-novel
    workers:
      - novel-writer
      - novel-planner
      - novel-reviewer
      - guardian
      - humanizer

    primary_agents:
      - leader-novel
      - novel-writer
      - novel-planner
      - novel-reviewer
      - guardian
      - humanizer

    secondary_agents:
      - shared-researcher        # 查资料时
      - editor                   # 统稿时
      - memory-keeper            # 记忆同步时

    # 编排与路由 — 知识已内联到 novel-checklist.md
    # novel-evaluator 是唯一保留的独立审查 skill（7维评分）
    primary_skills:
      - novel-evaluator          # 7维审稿评分（唯一保留的独立审查器）
      - novel-guardian           # 法医式连续性核查（角色/时间线/世界观）
      - novel-foreshadowing-dag  # 伏笔埋设/触发/回收 DAG 追踪
      - novel-writer-cn          # 中文小说创作框架（人物/剧情/多版本结局）

    secondary_skills: []

  news:
    # 执行环境（P0-1: Harness/Compute 分离）
    execution:
      default_provider: local
      fallback_provider: local
      isolation_level: none
      auto_cleanup: false

    # CEO → Domain Leader 派发
    leader: leader-news
    workers:
      - news-writer
      - fact-checker
      - news-editor

    primary_agents:
      - leader-news
      - news-writer
      - fact-checker

    secondary_agents:
      - news-editor            # 审校时
      - shared-researcher      # 调研时

    # 知识已内联到 news-checklist.md
    # fact-check 是唯一保留的独立审查 skill
    primary_skills:
      - fact-check

    secondary_skills: []

  # product 场景已合并到 code 域。本段保留为内部配置复用。
  # 路由：brainstorming → frontend-design / backend-doc-generator
  product:
    execution:
      default_provider: local
      fallback_provider: local
      isolation_level: none
      auto_cleanup: false

    # CEO → Domain Leader 派发
    leader: leader-product
    workers:
      - product-writer
      - product-reviewer

    primary_agents:
      - leader-product
      - product-writer
      - product-reviewer

    secondary_agents:
      - tech-writer            # 写技术文档/交付说明（已有 agent）

    # 场景预设（按客户类型路由）
    scenarios:
      college-frontend:
        description: "只想要前端页面的大学生"
        triggers:
          - 前端
          - 页面
          - HTML
          - Vue
          - React
          - 只想前端
        skills:
          - frontend-design
          - web-design-guidelines
        deliverables:
          - 页面代码
          - 部署说明
          - 使用文档

      college-backend:
        description: "只想要后端接口的大学生"
        triggers:
          - 后端
          - 接口
          - API
          - Spring
          - 只想后端
        skills:
          - backend-doc-generator
        deliverables:
          - 后端代码
          - API 文档
          - 部署说明

      college-fullstack:
        description: "前后端都要的大学生"
        triggers:
          - 全栈
          - 前后端
          - 完整
          - 都要
        skills:
          - frontend-design
          - backend-doc-generator
        deliverables:
          - 前端代码
          - 后端代码
          - 接口文档
          - 部署说明
          - 使用文档

    primary_skills:
      - brainstorming           # 场景选择 + 需求理解
      - frontend-design         # 前端交付
      - backend-doc-generator   # 后端交付
      - tech-writer             # 技术文档（agent：agents/tech-writer.md）

    secondary_skills:
      - superdesign             # 前端设计指南（已有 skill）
      - humanizer-zh           # 中文去 AI 味
      - humanizer              # 英文去 AI 味

# === Intelligence Layer ===
# codebase-memory-mcp 驱动（战略层 + 战术层统一），跨域共享
intelligence_skills:
  strategic:
    - understand-project        # index_repository + get_architecture
    - analyze-architecture      # get_architecture 深入分析
    - query-knowledge-graph     # search_graph / query_graph
  tactical:
    - index-project             # 建立/检查索引
    - query-symbol              # 定位代码符号
    - get-callers               # trace_path inbound
    - get-callees               # trace_path outbound
    - analyze-impact            # detect_changes 影响评估
    - ripgrep-search            # 文本/字符串搜索兜底
    - lsp-query                 # 编译器级定义/引用
    - code-insight-stack        # 三层协同编排入口

# === 运行时目录 ===
# handoff 机制已移除。Leader 直接对用户负责。
# 各域运行时产物路径见各域 artifacts 配置。
runtime:
  state_file: state.json
