# Strategic Layer Configuration

## MCP Server

### codebase-memory-mcp

```json
{
  "mcpServers": {
    "codebase_memory": {
      "command": "npx",
      "args": [
        "-y",
        "codebase-memory-mcp",
        "--ui=true"
      ],
      "env": {
        "NODE_ENV": "production"
      }
    }
  }
}
```

配置来源：`mcp-config/codebase-memory.json`（bootstrap 时投影到 `.mcp-config/`）。

## 核心工具

| 工具 | 用途 |
|------|------|
| `index_repository` | 建立/更新项目索引 |
| `index_status` | 检查索引状态 |
| `get_architecture` | 架构全貌（packages / layers / clusters / hotspots） |
| `search_graph` | 符号定位（BM25 / 正则 / 语义） |
| `get_code_snippet` | 精确源码读取 |
| `trace_path` | 调用链 / 数据流 / 跨服务路径 |
| `query_graph` | 复杂 Cypher 查询 |
| `detect_changes` | 变更检测与影响分析 |

## 配置说明

| 配置项 | 说明 |
|--------|------|
| `command` | 启动命令（npx） |
| `args` | 启动参数 |
| `env` | 环境变量 |

## 使用前提

1. 已安装 Node.js ≥ 18
2. 将 `mcp-config/codebase-memory.json` 接入宿主 MCP 配置
3. 首次使用调用 `index_repository` 建立索引
