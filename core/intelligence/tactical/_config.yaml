# Tactical Layer Configuration

## Provider Stack

战术层由三层工具组成，按"图 → 文本 → 语义"递进，相互补充：

| 层 | 工具 | 强项 |
|----|------|------|
| 知识图谱 | `codebase-memory` | 跨文件/跨服务/跨仓库的结构关系 |
| 文本搜索 | `ripgrep-search` (`rg`) | 字符串/正则/glob，速度快 |
| 语言服务 | `lsp-query` | 编译器级定义/引用/类型/诊断 |

```yaml
provider_stack:
  - name: codebase-memory
    role: 知识图谱
    skill: codebase-memory
  - name: ripgrep
    role: 文本搜索
    skill: ripgrep-search
  - name: lsp
    role: 语言服务
    skill: lsp-query
```

## Tool Mapping

| Harness 能力 | 主用 | 备用 |
|--------------|------|------|
| 建立/检查索引 | `codebase-memory.index_repository` / `index_status` | — |
| 跨文件结构查询 | `codebase-memory.search_graph` | `lsp-query` (`workspace/symbol`) |
| 符号定义 | `codebase-memory.search_graph` | `lsp-query` (`textDocument/definition`) |
| 调用方分析 | `lsp-query` (`textDocument/references`) | `codebase-memory.trace_path(direction="inbound")` |
| 被调用方分析 | `codebase-memory.trace_path(direction="outbound")` | `lsp-query` (`textDocument/hover`) |
| 类型/签名 | `lsp-query` (`textDocument/hover`) | `codebase-memory.get_code_snippet` |
| 字符串/注释/路径 | `ripgrep-search` | — |
| 编译错误 | `lsp-query` (`textDocument/diagnostic`) | `simplify` / `tdd` |
| 影响分析 | `codebase-memory.detect_changes` | `lsp-query` references 交叉验证 |
| 架构概览 | `codebase-memory.get_architecture` | `ripgrep-search` 列目录 |
| 重命名/重构 | `lsp-query` (`workspace/executeCommand`) | — |

## 决策流程

```text
拿任务
  ↓
是否新项目？ ─→ yes → get_architecture / index_repository
  ↓ no
知道符号名？
  ├─ yes → search_graph → lsp-query definition（拿权威定义）
  └─ no  → ripgrep-search 找关键字 → search_graph
  ↓
影响范围
  ├─ lsp-query references（语义、含继承）
  └─ trace_path(direction="inbound")（图、跨服务）
  ↓
类型/签名
  └─ lsp-query hover
  ↓
字符串/注释兜底
  └─ ripgrep-search
```

## 使用前提

1. 当前 AI 会话可使用 `codebase-memory` skill。
2. 宿主机可执行 `rg`（ripgrep ≥ 13）。
3. 当前 workspace 已挂载或可访问的 language server（typescript-language-server / pyright / gopls / rust-analyzer / clangd / jdtls / omnisharp-roslyn 等任一）。
4. 任意一层不可用时，先**报告降级**，再去下一层。

## 编排 Skill

`code-insight-stack` 是本层的"统一入口"，规定了三层协同的决策表和标准工作流。